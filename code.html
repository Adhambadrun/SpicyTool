<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Basis - Find your flight</title>
<!-- Tailwind CSS v3 CDN with forms and container plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#2563eb',
              'blue-hover': '#1d4ed8',
              dark: '#111827',
              gray: '#6b7280',
              border: '#e5e7eb',
              card: '#ffffff',
              bg: '#f8f9fa'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-decorations">
    /* Subtle glow for the active trip-type tab in light mode */
    .tab-active-glow {
      position: relative;
    }
    .tab-active-glow::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2.5px;
      background-color: #2563eb;
      border-radius: 9999px;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.45);
    }
  </style>
</head>
<body class="bg-[#f8f9fa] text-[#111827] min-h-screen font-sans antialiased flex flex-col justify-between">
<!-- BEGIN: MainHeader -->
<header class="w-full border-b border-gray-200/80 bg-white/70 backdrop-blur-md sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
<!-- Left: Logo & Wordmark -->
<div class="flex items-center gap-2 cursor-pointer select-none" data-purpose="brand-logo"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxzJVaullz9lufnSQ4tcosmZa-VzW7RVmbngyEZkOAyRBQEBNc2KOS6P9JOA-z2DVoFju4ycRE8GWWh9VQoNgt6p5iitlVLU1UJ7IFA6Rj3AjL3m181TkvvOBcer_jFgEUOFg5eZs6-15i5lgRVv_PVinfhfCGFXuMO_DZsO8Z78hJTqomH9p_ZioBlhPUlkiCVBfzKeQyjmqZokbrK9DkwfX35VOpm0BhdoSFP-Y48Rm0kRPqeZAL4SN377aeXgbOPA" alt="SpicyTool Logo" class="w-8 h-8 rounded-lg object-contain"><span class="text-xl font-bold tracking-tight text-gray-950">SpicyTool</span></div>
<!-- Right: Utility Controls & User Profile -->
<div class="flex items-center gap-3" data-purpose="header-actions">
<!-- Modify programs badge button -->
<button class="px-4 py-1.5 rounded-full text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200/80 border border-gray-200 transition-colors" type="button">
          Modify programs (29)
        </button>
<!-- Theme Toggle Switch -->
<div class="flex items-center p-1 bg-gray-100 rounded-full border border-gray-200 text-gray-600">
<button aria-label="Light mode active" class="p-1.5 rounded-full bg-white text-gray-900 shadow-sm transition" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button aria-label="Switch to dark mode" class="p-1.5 rounded-full text-gray-400 hover:text-gray-700 transition" type="button">
<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
<path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
</svg>
</button>
</div>
<!-- User Profile Avatar Icon -->
<button aria-label="User Account" class="w-9 h-9 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: FlightSearchSection -->
<main class="flex-grow flex flex-col items-center justify-center px-4 py-12 md:py-16">
<div class="w-full max-w-4xl mx-auto flex flex-col items-center">
<!-- Headline -->
<h1 class="text-4xl md:text-5xl font-extrabold text-[#111827] tracking-tight mb-8 text-center">
        Find your flight
      </h1>
<!-- Trip Type Switcher Bar -->
<div class="w-full max-w-2xl border-b border-gray-200 flex justify-center items-center mb-6" data-purpose="trip-type-tabs">
<button class="pb-3 px-8 text-sm font-medium text-gray-500 hover:text-gray-900 flex items-center gap-2 transition-colors" type="button">
<span class="">Round Trip</span>
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            Live Data
          </span>
</button>
<button class="pb-3 px-8 text-sm font-semibold text-[#111827] flex items-center gap-2 tab-active-glow" type="button">
<span class="">One Way</span>
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            Live Data
          </span>
</button>
</div>
<!-- Main Search Card -->
<section class="w-full bg-white rounded-2xl border border-gray-200 shadow-sm p-5 md:p-6" data-purpose="search-card">
<!-- Filter Dropdowns Row -->
<div class="flex items-center gap-6 mb-4 text-sm font-medium text-gray-700" data-purpose="class-and-passengers">
<!-- Business Class dropdown trigger -->
<div class="relative flex items-center gap-1.5 cursor-pointer hover:text-gray-950">
<span class="">Business Class</span>
<svg class="w-3.5 h-3.5 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</div>
<!-- Passenger Count dropdown trigger -->
<div class="relative flex items-center gap-1.5 cursor-pointer hover:text-gray-950">
<span class="">1 Passenger</span>
<svg class="w-3.5 h-3.5 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
<!-- Input Fields Row: Origin, Swap, Destination, Departure Date -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-3 items-center" data-purpose="flight-inputs-row">
<!-- Origin & Destination Combined Box / Layout -->
<div class="lg:col-span-8 flex items-center relative gap-2">
<!-- Origin Input Field -->
<div class="flex-1 flex items-center bg-[#f8f9fa] border border-gray-200 hover:border-gray-300 rounded-xl px-3.5 py-2.5 h-[52px] transition">
<!-- Location Target Pin Icon -->
<svg class="w-5 h-5 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="3"></circle>
<path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Selected Airport Tag (ATH) -->
<div class="inline-flex items-center gap-1.5 bg-gray-200/70 hover:bg-gray-200 px-2.5 py-1 rounded-lg text-xs font-semibold text-gray-800 transition">
<span class="">ATH</span>
<button aria-label="Remove Athens" class="text-gray-500 hover:text-gray-700" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Swap Locations Button -->
<button aria-label="Swap origin and destination" class="z-10 w-8 h-8 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-gray-900 hover:border-gray-400 transition -mx-3 flex-shrink-0" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-9L21 12m0 0L16.5 7.5M21 12H7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Destination Input Field -->
<div class="flex-1 flex items-center bg-[#f8f9fa] border border-gray-200 hover:border-gray-300 rounded-xl px-3.5 py-2.5 h-[52px] transition">
<!-- Location Marker Icon -->
<svg class="w-5 h-5 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Selected Airport Tag (NYC) -->
<div class="inline-flex items-center gap-1.5 bg-gray-200/70 hover:bg-gray-200 px-2.5 py-1 rounded-lg text-xs font-semibold text-gray-800 transition">
<span class="">NYC</span>
<button aria-label="Remove New York City" class="text-gray-500 hover:text-gray-700" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</div>
<!-- Departure Date Picker Input -->
<div class="lg:col-span-4">
<div class="flex items-center bg-[#f8f9fa] border border-gray-200 hover:border-gray-300 rounded-xl px-3.5 py-2.5 h-[52px] cursor-pointer transition">
<!-- Calendar Icon -->
<svg class="w-5 h-5 text-gray-400 mr-2.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-sm font-medium text-gray-900">Sep 16, 2026</span>
</div>
</div>
</div>
<!-- Horizontal Divider -->
<div class="border-t border-gray-100 my-5"></div>
<!-- Options & Search Button Footer -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4" data-purpose="card-footer-controls">
<!-- Checkbox / Toggle Options -->
<div class="space-y-2 text-sm">
<!-- Hidden city option -->
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<span class="flex items-center justify-center w-5 h-5 rounded-full bg-[#e11d2e] text-white"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path></svg></span>
<span class="font-medium text-gray-800">Check hidden city and upgrade fares.</span>
</label>
<!-- Super hc mode option -->
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<span class="w-5 h-5 rounded-full border-2 border-gray-300 bg-white inline-block"></span>
<span class="text-gray-600 font-normal">Enable super hc mode (10 remaining for this month)</span>
</label>
</div>
<!-- Submit Search Button -->
<button class="w-full sm:w-44 py-3 px-6 rounded-full bg-[#e11d2e] hover:bg-[#c81624] text-white font-medium text-sm tracking-wide shadow-sm hover:shadow transition-all flex items-center justify-center cursor-pointer" type="button">Search</button>
</div>
</section>
</div>
</main>
<!-- END: FlightSearchSection -->
<!-- BEGIN: PageFooter -->
<footer class="py-6 text-center text-xs text-gray-400"><span class="">© 2026 SpicyTool. Built with precision for award travelers.</span></footer>
<!-- END: PageFooter -->


</body></html>
