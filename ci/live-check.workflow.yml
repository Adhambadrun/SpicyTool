# SpicyTool LIVE verification — runs on a GitHub Actions runner, which has
# full outbound internet access.
#
# ── INSTALLED ────────────────────────────────────────────────────────────────
# This workflow now lives at .github/workflows/live-check.yml and runs on every
# push, weekly (Monday), and on manual dispatch (Actions tab → Run workflow).
#
# Live gates are credential-gated and NEVER fabricate availability: a step is
# skipped (not faked, not failed-to-green) while its secret is absent. Add the
# secrets as encrypted repository secrets (this repo is public — never commit
# key material):
#
#   Settings → Secrets and variables → Actions → New repository secret
#   Name:  FLYBASIS_API_KEY      (token issued to you by Flybasis for the
#                                 award socket — the one provider that produces
#                                 results; see FLYBASIS_GO_LIVE.md)
#   Name:  FLYBASIS_REFRESH_TOKEN / FLYBASIS_SUPABASE_ANON_KEY
#                                 (OPTIONAL alternative — session mode, see
#                                 FLYBASIS_GO_LIVE.md Option B. Used only when
#                                 FLYBASIS_API_KEY is blank. Never commit these.)
#   Name:  AGENTSEARCH_API_KEY   (OPTIONAL — RapidAPI key for the web-context
#                                 backend only; never an award feed)
#
# A live gate fails loudly if the key is rejected, out of quota, or the schema
# drifts — so it doubles as an ongoing contract test against the real API.
name: SpicyTool live check

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  schedule:
    # Weekly, so upstream schema/quota drift is caught before a user hits it.
    - cron: "17 6 * * 1"

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level so the step `if:` conditions can see them (and so the secrets
    # are masked for every step). Empty while the repo secret is unset.
    env:
      FLYBASIS_API_KEY: ${{ secrets.FLYBASIS_API_KEY }}
      FLYBASIS_REFRESH_TOKEN: ${{ secrets.FLYBASIS_REFRESH_TOKEN }}
      FLYBASIS_SUPABASE_ANON_KEY: ${{ secrets.FLYBASIS_SUPABASE_ANON_KEY }}
      AGENTSEARCH_API_KEY: ${{ secrets.AGENTSEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Always-green gates: these need no credential and no outbound access.
      - name: Offline integration suite
        working-directory: backend
        run: python tests_integration.py

      - name: Real-HTTP verification against the local mock upstream
        working-directory: backend
        run: python tools/verify_agentsearch.py

      # The one provider production actually relays. Its socket handshake had
      # no test at all, so a broken connect/search/error path used to ship as
      # an empty results list with nothing to explain it.
      - name: Flybasis award-socket contract test (local mock)
        working-directory: backend
        run: python tools/verify_flybasis_socket.py

      - name: Frontend jsdom regression tests
        working-directory: frontend/test
        run: |
          npm install --silent
          node web-context.mjs
          node search-stream-race.mjs
          node no-provider-empty.mjs
          node booking-window.mjs

      # ─── LIVE gates ────────────────────────────────────────────────────────
      # Each skips (does not fail, does not fake) when its secret is absent, so
      # the workflow stays useful on forks and before credentials exist. The
      # moment a real key is added to the repo secret, the gate runs for real.

      # The award-feed contract test against production. This is THE live gate:
      # it proves a Flybasis-issued key (or a Supabase session) actually
      # connects and returns frames.
      - name: Flybasis live socket (real upstream)
        if: ${{ env.FLYBASIS_API_KEY != '' || env.FLYBASIS_REFRESH_TOKEN != '' }}
        working-directory: backend
        run: python tools/verify_flybasis_socket.py --live

      # Optional web-context backend (NOT an award feed).
      - name: Raw AgentSearch upstream call (web context)
        if: ${{ env.AGENTSEARCH_API_KEY != '' }}
        run: |
          echo "::group::GET /v1/search"
          code=$(curl -sS -o /tmp/live.json -w '%{http_code}' --max-time 30 \
            --url 'https://agentsearch.p.rapidapi.com/v1/search?provider=brave&country=us&limit=3&query=anthropic%20claude' \
            --header 'Content-Type: application/json' \
            --header 'x-rapidapi-host: agentsearch.p.rapidapi.com' \
            --header "x-rapidapi-key: ${AGENTSEARCH_API_KEY}")
          echo "HTTP $code"
          # Print the body WITHOUT the key ever being echoed.
          python -c "import json;print(json.dumps(json.load(open('/tmp/live.json')),indent=2)[:2000])" \
            || cat /tmp/live.json
          echo "::endgroup::"
          test "$code" = "200"

      - name: LIVE assertions through the real app code (web context)
        if: ${{ env.AGENTSEARCH_API_KEY != '' }}
        working-directory: backend
        run: python tools/verify_agentsearch.py --live

      - name: Note when live gates were skipped
        if: ${{ env.FLYBASIS_API_KEY == '' && env.FLYBASIS_REFRESH_TOKEN == '' && env.AGENTSEARCH_API_KEY == '' }}
        run: |
          echo "::warning::No live credential set — live checks were skipped" \
               "(never faked). Add FLYBASIS_API_KEY (required for award" \
               "results; or the Option-B session secrets) and optionally " \
               "AGENTSEARCH_API_KEY under Settings → Secrets and variables →" \
               "Actions to enable them."
