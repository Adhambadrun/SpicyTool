<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpicyTool - Find your flight</title>
<!-- Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for SpicyTool Dark + Red Design System -->
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#E11D2E',
              'red-hover': '#C81423',
              'red-glow': 'rgba(225, 29, 46, 0.25)',
            },
            surface: {
              bg: '#0D0E10',
              card: '#161719',
              input: '#1F2023',
              border: '#28292D',
              pill: '#212226'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>
<!-- Custom Style Rules -->
<style data-purpose="custom-glow-effects">
    /* Active tab subtle glow and indicator */
    .tab-active-glow {
      position: relative;
      background: radial-gradient(circle at 50% 100%, rgba(225, 29, 46, 0.22) 0%, rgba(225, 29, 46, 0) 70%);
      border-bottom: 2px solid #E11D2E;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#0D0E10] text-[#F5F5F7] min-h-screen font-sans antialiased selection:bg-brand-red selection:text-white flex flex-col justify-between">
<!-- BEGIN: TopNavigationHeader -->
<header class="w-full border-b border-surface-border/40 px-6 sm:px-10 py-3.5 flex items-center justify-between">
<!-- Brand Logo and Name -->
<div class="flex items-center gap-3" data-purpose="brand-identity">
<img alt="SpicyTool Logo" class="w-8 h-8 rounded-lg object-contain shadow-md shadow-brand-red/20" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKiQRmjg_99Bush8OqQQjbf4S7cXtsRmX-dR7HFPCuw1I29pmuW6djdkf2zWM1nbQqEFAj9O9ZtGFbRwJkX2xe9qABCigzLGt083TWQ07ffgTqJ0cEP2f5jnKHxMWE-CxrCbX08I9vpvuj2SyhTadUylF2lR2JrKDfmyGnGQrNtCcbXnBhCPzcIQoEpIOk8JKoH4woMWiuqs_Wm3M64FTR0ed2ClzEyceCB1gK2Dwnf8YEXBedrP-XoRe1MddTwcKGwA"/>
<span class="text-xl font-bold tracking-tight text-white flex items-center">
        Spicy<span class="text-brand-red">Tool</span>
</span>
</div>
<!-- Right-Hand Controls & User Actions -->
<div class="flex items-center gap-3.5" data-purpose="header-controls">
<!-- Modify Programs Pill Button -->
<button class="inline-flex items-center gap-1.5 px-4 py-1.5 text-sm font-medium text-[#D1D1D6] bg-[#1E1F23] hover:bg-[#27292F] border border-[#2D2F36] rounded-full transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-brand-red/40" type="button">
<span>Modify programs</span>
<span class="text-[#A1A1AA]">(29)</span>
</button>
<!-- Theme Switcher (Sun / Moon) Pill -->
<div class="flex items-center bg-[#1E1F23] border border-[#2D2F36] rounded-full p-0.5" data-purpose="theme-toggle">
<button aria-label="Light Mode" class="p-1.5 text-[#71717A] hover:text-[#D1D1D6] rounded-full transition" type="button">
<!-- Sun Icon -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button aria-label="Dark Mode" class="p-1.5 text-[#F5F5F7] bg-[#2C2E34] rounded-full shadow transition" type="button">
<!-- Moon Icon -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- User Profile Avatar Icon -->
<button aria-label="Account Profile" class="w-8 h-8 rounded-full bg-[#1E1F23] border border-[#2D2F36] flex items-center justify-center text-[#A1A1AA] hover:text-white hover:border-[#3D4049] transition" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</header>
<!-- END: TopNavigationHeader -->
<!-- BEGIN: MainContent -->
<main class="w-full max-w-5xl mx-auto px-4 sm:px-6 pt-16 pb-24 flex-1 flex flex-col justify-start">
<!-- Hero Title -->
<div class="text-center mb-10">
<h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">
        Find your flight
      </h1>
</div>
<!-- Flight Type Switcher Tabs (Round Trip / One Way) -->
<div class="w-full max-w-2xl mx-auto border-b border-[#232429] grid grid-cols-2 mb-8">
<!-- Round Trip Tab (Inactive) -->
<button class="py-3 px-4 inline-flex items-center justify-center gap-2 text-sm sm:text-base font-medium text-[#8E8E93] hover:text-[#E4E4E7] transition relative" type="button">
<span>Round Trip</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-[#13241A] text-[#34D399] border border-[#164E2D]/60">
<span class="w-1.5 h-1.5 rounded-full bg-[#34D399] mr-1"></span>
          Live Data
        </span>
</button>
<!-- One Way Tab (Active with Spicy Red Indicator & Glow) -->
<button class="py-3 px-4 inline-flex items-center justify-center gap-2 text-sm sm:text-base font-medium text-white tab-active-glow transition" type="button">
<span>One Way</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-[#13241A] text-[#34D399] border border-[#164E2D]/60">
<span class="w-1.5 h-1.5 rounded-full bg-[#34D399] mr-1"></span>
          Live Data
        </span>
</button>
</div>
<!-- BEGIN: SearchCard -->
<section aria-label="Flight Search" class="bg-[#141416] border border-[#232429] rounded-2xl p-6 sm:p-7 shadow-2xl relative" data-purpose="search-box-card">
<!-- Filter Dropdowns Row (Business Class & Passengers) -->
<div class="flex items-center gap-6 mb-5 text-sm text-[#E4E4E7] font-medium">
<!-- Cabin Class Dropdown -->
<button class="inline-flex items-center gap-1.5 hover:text-white transition focus:outline-none" type="button">
<span>Business Class</span>
<svg class="w-3.5 h-3.5 text-[#8E8E93]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
<!-- Passengers Dropdown -->
<button class="inline-flex items-center gap-1.5 hover:text-white transition focus:outline-none" type="button">
<span>1 Passenger</span>
<svg class="w-3.5 h-3.5 text-[#8E8E93]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
<!-- Main Flight Route Inputs Row -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-3 items-center mb-6">
<!-- Origin & Destination Combined Container -->
<div class="lg:col-span-8 flex flex-col sm:flex-row items-center gap-2 relative">
<!-- Origin Input Field -->
<div class="w-full relative flex items-center bg-[#1D1E22] border border-[#2B2D33] rounded-xl px-3.5 py-2.5 h-[52px] focus-within:border-[#4B4E59] transition">
<!-- Crosshair Target Icon -->
<svg class="w-4 h-4 text-[#8E8E93] mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="7" stroke-width="2"></circle>
<path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke-linecap="round" stroke-width="2"></path>
</svg>
<!-- Airport Badge Chip (Athens) -->
<div class="inline-flex items-center gap-1.5 bg-[#2C2E35] text-white text-xs sm:text-sm font-semibold px-2.5 py-1 rounded-md border border-[#393C45]">
<span>ATH</span>
<button aria-label="Remove ATH" class="text-[#9E9EA6] hover:text-white" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Invisible actual input for typing extra query -->
<input class="w-full bg-transparent border-0 focus:ring-0 text-sm text-white px-2 py-0" placeholder="" type="text"/>
</div>
<!-- Airport Swap Button -->
<button aria-label="Swap origin and destination" class="z-10 -my-2 sm:my-0 sm:-mx-3 flex items-center justify-center w-8 h-8 rounded-full bg-[#26282E] border border-[#353842] hover:bg-[#30333B] text-[#A1A1AA] hover:text-white transition shadow-sm flex-shrink-0 focus:outline-none" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Destination Input Field -->
<div class="w-full relative flex items-center bg-[#1D1E22] border border-[#2B2D33] rounded-xl px-3.5 py-2.5 h-[52px] focus-within:border-[#4B4E59] transition">
<!-- Pin Map Icon -->
<svg class="w-4 h-4 text-[#8E8E93] mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<!-- Airport Badge Chip (New York City) -->
<div class="inline-flex items-center gap-1.5 bg-[#2C2E35] text-white text-xs sm:text-sm font-semibold px-2.5 py-1 rounded-md border border-[#393C45]">
<span>NYC</span>
<button aria-label="Remove NYC" class="text-[#9E9EA6] hover:text-white" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Ghost text / input -->
<input class="w-full bg-transparent border-0 focus:ring-0 text-sm text-white px-2 py-0" placeholder="" type="text"/>
</div>
</div>
<!-- Departure Date Picker Field -->
<div class="lg:col-span-4">
<div class="w-full relative flex items-center bg-[#1D1E22] border border-[#2B2D33] rounded-xl px-4 py-2.5 h-[52px] focus-within:border-[#4B4E59] cursor-pointer transition">
<!-- Calendar Icon -->
<svg class="w-4 h-4 text-[#8E8E93] mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<!-- Date Display -->
<span class="text-sm font-medium text-[#F4F4F5]">Sep 16, 2026</span>
</div>
</div>
</div>
<!-- Divider line -->
<div class="border-t border-[#232429] mb-5"></div>
<!-- Bottom Controls: Options Toggles & Primary Action -->
<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
<!-- Checkbox / Toggle Options -->
<div class="flex flex-col gap-2.5" data-purpose="search-options">
<!-- Option 1: Check hidden city and upgrade fares (Active) -->
<label class="inline-flex items-center gap-2.5 cursor-pointer group select-none">
<span class="w-4 h-4 rounded-full bg-[#10B981] flex items-center justify-center text-[#0D0E10]">
<svg class="w-2.5 h-2.5 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span class="text-xs sm:text-sm text-[#E4E4E7] group-hover:text-white transition">
              Check hidden city and upgrade fares.
            </span>
</label>
<!-- Option 2: Enable super hc mode (Inactive) -->
<label class="inline-flex items-center gap-2.5 cursor-pointer group select-none">
<span class="w-4 h-4 rounded-full border border-[#444752] group-hover:border-[#6B7280] transition bg-transparent"></span>
<span class="text-xs sm:text-sm text-[#A1A1AA] group-hover:text-[#D1D1D6] transition">
              Enable super hc mode (10 remaining for this month)
            </span>
</label>
</div>
<!-- Primary Red Search CTA Button -->
<button class="w-full sm:w-auto px-10 py-3 bg-brand-red hover:bg-brand-red-hover text-white text-sm font-semibold rounded-full shadow-lg shadow-brand-red/30 hover:shadow-brand-red/40 transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#141416] focus:ring-brand-red self-end sm:self-center" type="button">
          Search
        </button>
</div>
</section>
<!-- END: SearchCard -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: MinimalFooter -->
<footer class="w-full py-6 text-center text-xs text-[#52525B]">
<p>© 2026 SpicyTool. Built with precision for award travelers.</p>
</footer>
<!-- END: MinimalFooter -->
</body></html>
